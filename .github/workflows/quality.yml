name: Quality

on:
  push:
    branches: [main, v0.2-phase-0]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned build tokenizer
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input tiktoken==0.14.0

      - name: Validate scaffold, generated bundles, eval manifest, and Phase 0 controls
        shell: pwsh
        run: ./scripts/validate.ps1
